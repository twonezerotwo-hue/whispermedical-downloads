name: debug-applet
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer's AppleScript as a plain script so that errors are printed instead of shown in a dialog
        run: |
          tmo() { t=$1; shift; "$@" & p=$!; ( sleep $t; kill -9 $p 2>/dev/null ) & w=$!; wait $p; rc=$?; kill $w 2>/dev/null; return $rc; }
          mkdir -p /tmp/p/dest
          sed "s#POSIX path of (path to resource \"install.sh\")#\"$GITHUB_WORKSPACE/bootstrap/mac-intel/install.sh\"#" bootstrap/mac-intel/Installer.applescript > /tmp/p/inst.applescript
          grep -n "install.sh" /tmp/p/inst.applescript | head -3
          printf 'PIN_VERSION=9.9.9\nPIN_DMG_SIZE=1\nPIN_DMG_SHA256=00\n' > bootstrap/mac-intel/pins.env
          ( WM_AUTOMATED=1 WM_DEST=/tmp/p/dest WM_ENV="MLT_TEST=1" tmo 60 osascript /tmp/p/inst.applescript; echo "osascript rc=$?" ) 2>&1 | tail -15
