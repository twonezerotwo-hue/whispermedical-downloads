name: test-windows-installer

# The Windows installer program (WhisperMedical-Installer-Windows.exe): built with the pinned values exactly as for a release, then tested against a local
# server with a fake payload (download, resume after cut connections, every refusal). The real end-to-end run is finalize-release.
on:
  push:
    paths:
      - "bootstrap/windows/**"
      - "tests/test_windows_bootstrapper.py"
      - "pins/windows.json"
      - ".github/workflows/test-windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the release installer program
        shell: bash
        run: |
          python -m pip install --quiet pytest
          SHA=$(python -c "import json;print(json.load(open('pins/windows.json'))['setup']['sha256'])")
          SIZE=$(python -c "import json;print(json.load(open('pins/windows.json'))['setup']['size'])")
          python bootstrap/windows/build.py --setup-sha256 "$SHA" --setup-size "$SIZE" --out dist/WhisperMedical-Installer-Windows.exe
          ls -l dist
      - name: Tests (fake payload, local server)
        shell: bash
        run: python -m pytest tests/test_windows_bootstrapper.py tests/test_site_tools.py tests/test_assemble.py -q
      - name: The program starts and refuses cleanly while nothing is published
        shell: pwsh
        run: |
          $p = Start-Process .\dist\WhisperMedical-Installer-Windows.exe -ArgumentList '--console','--unattended','--no-launch' -Wait -PassThru -RedirectStandardOutput o.txt -RedirectStandardError e.txt
          Get-Content o.txt
          "exit code $($p.ExitCode)"
          if ($p.ExitCode -eq 0) { throw "an installer for a platform that is not published must not succeed" }
          if (-not (Select-String -Path o.txt -Pattern 'not available|out of date' -Quiet)) { throw "unexpected message" }
