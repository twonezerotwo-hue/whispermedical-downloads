name: mirror-model

# One-time (re-runnable): copies the Whisper large-v3 speech model (MIT licence) from Hugging Face into a public release of THIS repository, byte for byte,
# so the installers fetch everything from one official place. Every file is checked against the pinned SHA-256 values before and after splitting.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download from Hugging Face and verify every file
        run: |
          df -h / | tail -1
          python3 scripts/mirror_model.py mirror_out
          ls -l mirror_out
          df -h / | tail -1
      - name: Publish (draft first, public only when every asset is there)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=model-whisper-large-v3
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          NOTES="Byte-identical copy of Systran/faster-whisper-large-v3 revision edaa852ec7e145841d8ffdb056a99866b5f0a478 (MIT licence, see licenses/MODEL_LICENSES.txt). model.bin is stored in two pieces because a release file may be at most 2 GiB; the installers join and verify them. You do not need to download these files yourself."
          for attempt in 1 2 3 4 5 6; do
            gh release create "$TAG" --draft --latest=false --title "Whisper large-v3 (CTranslate2) - mirror for the WhisperMedical installers" --notes "$NOTES" && break
            echo "create attempt $attempt failed"; sleep $((attempt * 10))
          done
          for f in mirror_out/*; do
            for attempt in 1 2 3 4 5; do gh release upload "$TAG" "$f" --clobber && break; echo "retry $f"; sleep 15; done
          done
          COUNT=$(gh release view "$TAG" --json assets --jq '.assets | length')
          test "$COUNT" = "6" || { echo "expected 6 assets, found $COUNT"; exit 1; }
          gh release edit "$TAG" --draft=false --latest=false
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'
