name: finalize-release

# Run after the big files of a platform have been uploaded (as a DRAFT release) by the release automation (assemble-release). For Windows the order is
#   1. build the small installer program with the pinned checksums and test it,
#   2. STAGE: the draft becomes a pre-release (public files, not linked from the page or the manifest, not "latest"),
#   3. download the exact public bytes like a visitor (no token, no login), check size and SHA-256, and run the real installation on clean machines:
#      a fresh install and an upgrade over WhisperMedical 4.0.0 (the user's data must stay), start with the network blocked, transcribe a short public-domain clip,
#   4. PROMOTE: one commit to main puts the release into release-manifest.json (status "uploaded"); this is the last step before the shipped installer program is tested,
#   5. run the SHIPPED installer program from the public manifest for real; if that fails the previous manifest is restored (windows-rollback),
#   6. record the verification; only then, and only with LEGAL_ACKNOWLEDGED=yes, mark the platform "ready" - which is what enables the button on the download page.
# Intel Mac keeps the earlier order (its build can only be produced and tested on a real Intel Mac).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "windows | mac-intel"
        type: choice
        options: [windows, mac-intel]

permissions:
  contents: write

concurrency:
  group: finalize-${{ inputs.platform }}
  cancel-in-progress: false

env:
  JFK_URL: https://github.com/openai/whisper/raw/main/tests/jfk.flac
  PAGE: https://twonezerotwo-hue.github.io/whispermedical-downloads

jobs:
  # ================================================================================================================== Windows
  # The order for Windows (nothing the public manifest or the download page shows changes before step 4):
  #   1 windows-build         the small installer program is built with the pinned checksums and tested
  #   2 windows-stage         the STAGING release windows-vX.Y.Z: the draft becomes a pre-release (public files, not linked anywhere, not "latest")
  #   3 windows-verify-clean  / windows-verify-upgrade   the exact public bytes are downloaded like a visitor (no token), hash-checked, installed on a clean machine
  #                           and over an installed WhisperMedical 4.0.0, started with the network blocked, a short clip is transcribed
  #   4 windows-promote       ONE commit to main: release-manifest.json (+ the redirect pages) now list this release (status "uploaded")  <- the last step
  #   5 windows-verify        the SHIPPED installer program is downloaded from the public manifest and run for real; if it fails, windows-rollback restores the previous manifest
  #   6 windows-ready         the verification is recorded; "ready" (button on) only with the owner's LEGAL_ACKNOWLEDGED=yes; the release becomes a normal, latest release
  windows-build:
    if: ${{ inputs.platform == 'windows' }}
    runs-on: windows-latest
    outputs:
      sha: ${{ steps.entry.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the installer program with the pinned checksums and test it
        id: entry
        shell: bash
        run: |
          python -m pip install --quiet pytest
          SHA=$(python -c "import json;print(json.load(open('pins/windows.json'))['setup']['sha256'])")
          SIZE=$(python -c "import json;print(json.load(open('pins/windows.json'))['setup']['size'])")
          VER=$(python -c "import json;print(json.load(open('pins/windows.json'))['version'])")
          python bootstrap/windows/build.py --version "$VER" --setup-sha256 "$SHA" --setup-size "$SIZE" --out dist/MELETRA-Installer-Windows.exe
          python -m pytest tests/test_windows_bootstrapper.py tests/test_site_tools.py -q
          python scripts/build_entries.py windows dist/MELETRA-Installer-Windows.exe > dist/entry.json
          cp pins/windows.json dist/pins.json
          cat dist/entry.json | head -20
          echo "sha=$(python -c "import json;print(json.load(open('dist/entry.json'))['bootstrapper']['sha256'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/MELETRA-Installer-Windows.exe
            dist/entry.json
            dist/pins.json

  windows-stage:
    needs: windows-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Complete the release and make it a STAGING (pre-)release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import json;print(json.load(open('pins/windows.json'))['version'])")
          TAG="windows-v$VER"
          python3 - <<'EOF'
          import json, subprocess, sys
          pins = json.load(open("pins/windows.json"))
          out = subprocess.run(["gh", "release", "view", "windows-v" + pins["version"], "--json", "assets", "--jq", ".assets | map({(.name): .size}) | add"], capture_output=True, text=True)
          have = json.loads(out.stdout or "{}")
          want = pins["setup"]
          if have.get(want["name"]) != want["size"]:
              sys.exit(f"the release does not hold the installer {want['name']} with {want['size']} bytes (found {have.get(want['name'])})")
          EOF
          python3 - <<'EOF'
          import json
          pins = json.load(open("pins/windows.json")); entry = json.load(open("dist/entry.json"))
          lines = [f"{pins['setup']['sha256']}  {pins['setup']['name']}", f"{entry['bootstrapper']['sha256']}  {entry['bootstrapper']['name']}"]
          open("dist/SHA256SUMS.txt", "w", newline="\n").write("\n".join(lines) + "\n")
          EOF
          cat dist/SHA256SUMS.txt
          NOTES="release-notes/MELETRA-$VER.md"; test -f "$NOTES" || { echo "::error::$NOTES is missing"; exit 1; }
          gh release upload "$TAG" dist/MELETRA-Installer-Windows.exe dist/SHA256SUMS.txt licenses/THIRD_PARTY_LICENSES.txt licenses/MODEL_LICENSES.txt --clobber
          gh release edit "$TAG" --draft=false --prerelease --latest=false --title "MELETRA $VER" --notes-file "$NOTES"
          gh release view "$TAG" --json isDraft,isPrerelease,assets --jq '{isDraft, isPrerelease, assets: [.assets[] | {name, size}]}'

  windows-verify-clean:
    needs: [windows-build, windows-stage]
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      EXPECT_SHA: ${{ needs.windows-build.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Download the staged files like a visitor (no token, no login) and check every byte
        shell: pwsh
        run: |
          Remove-Item Env:GH_TOKEN, Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $pins = Get-Content pins/windows.json -Raw | ConvertFrom-Json
          $base = "https://github.com/twonezerotwo-hue/whispermedical-downloads/releases/download/windows-v$($pins.version)"
          New-Item -ItemType Directory -Force stage | Out-Null
          curl.exe -fL --retry 8 --retry-all-errors -o "stage\$($pins.setup.name)" "$base/$($pins.setup.name)"
          curl.exe -fL --retry 8 --retry-all-errors -o stage\MELETRA-Installer-Windows.exe "$base/MELETRA-Installer-Windows.exe"
          curl.exe -fL --retry 8 --retry-all-errors -o stage\SHA256SUMS.txt "$base/SHA256SUMS.txt"
          $setup = Get-Item "stage\$($pins.setup.name)"
          $h = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "setup: $($setup.Length) bytes sha256 $h"
          if ($setup.Length -ne [int64]$pins.setup.size -or $h -ne $pins.setup.sha256) { throw "the public setup differs from the pinned size / SHA-256" }
          $b = (Get-FileHash stage\MELETRA-Installer-Windows.exe -Algorithm SHA256).Hash.ToLower()
          "installer program: sha256 $b"
          if ($b -ne $env:EXPECT_SHA) { throw "the public installer program is not the one that was built" }
          $sums = Get-Content stage\SHA256SUMS.txt
          if (-not ($sums -contains "$h  $($pins.setup.name)") -or -not ($sums -contains "$b  MELETRA-Installer-Windows.exe")) { throw "SHA256SUMS.txt does not match the files" }
          "all public bytes match"
      - name: Run the installer program (test build of the same sources and pins) against the public addresses of this staged release
        shell: bash
        run: |
          VER=$(python -c "import json;print(json.load(open('pins/windows.json'))['version'])")
          SHA=$(python -c "import json;print(json.load(open('pins/windows.json'))['setup']['sha256'])")
          SIZE=$(python -c "import json;print(json.load(open('pins/windows.json'))['setup']['size'])")
          python bootstrap/windows/build.py --test --version "$VER" --setup-sha256 "$SHA" --setup-size "$SIZE" --out dist/boot_stage.exe
          mkdir -p www
          python - <<'EOF'
          import json
          entry = json.load(open("dist/entry.json")); entry["status"] = "uploaded"
          json.dump({"version": entry["version"], "product_version": entry["version"], "windows": entry}, open("www/manifest.json", "w"))
          EOF
          python -m http.server 8765 --bind 127.0.0.1 --directory www > http.log 2>&1 &
          SERVER=$!
          sleep 3
          set +e
          ./dist/boot_stage.exe --console --no-launch --manifest-url http://127.0.0.1:8765/manifest.json > boot.out.txt 2> boot.err.txt
          CODE=$?
          kill $SERVER 2>/dev/null
          tail -40 boot.out.txt
          [ $CODE -eq 0 ] || { cat boot.err.txt; echo "installer exit code $CODE"; exit 1; }
      - name: The installed program is MELETRA and the model is in place
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{6F0B7C52-3A1E-4E7D-9C54-8D2A7B1E4F60}_is1'
          $item = Get-ItemProperty $key
          "$($item.DisplayName) $($item.DisplayVersion) in $($item.InstallLocation)"
          if ($item.DisplayName -notlike 'MELETRA*') { throw "Apps & Features shows '$($item.DisplayName)'" }
          $exe = Join-Path $item.InstallLocation 'MELETRA.exe'
          if (-not (Test-Path $exe)) { throw "the program was not installed (looked in $($item.InstallLocation))" }
          $vi = (Get-Item $exe).VersionInfo
          "exe: $($vi.ProductName) $($vi.FileVersion) - $($vi.FileDescription)"
          if ($vi.ProductName -ne 'MELETRA') { throw "the exe says '$($vi.ProductName)'" }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\MELETRA")) { throw "no MELETRA entry in the Start menu" }
          $model = "$env:LOCALAPPDATA\MedicalLectureTranscriber\models\whisper-large-v3"
          Get-ChildItem $model | Select-Object Name, Length | Format-Table
          if (-not (Test-Path "$model\model.bin")) { throw "the speech model was not placed" }
          if (Test-Path "$env:LOCALAPPDATA\MELETRAInstaller\cache") { throw "temporary installer files were left behind" }
          # the optional offline translation pack (ticked by default): every file is the pinned one
          $pack = "$env:LOCALAPPDATA\MedicalLectureTranscriber\models\translation-m2m100"
          $tp = Get-Content scripts/translation_pack.json -Raw | ConvertFrom-Json
          foreach ($f in $tp.output.PSObject.Properties) {
            $p = Join-Path $pack $f.Name
            if (-not (Test-Path $p)) { throw "translation pack file missing: $($f.Name)" }
            $h = (Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
            if ((Get-Item $p).Length -ne [int64]$f.Value.size -or $h -ne $f.Value.sha256) { throw "translation pack file differs from its pin: $($f.Name)" }
            "pack $($f.Name): $((Get-Item $p).Length) bytes, sha256 ok"
          }
      - name: The installed program works with the network blocked (self-test, a short clip is transcribed)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{6F0B7C52-3A1E-4E7D-9C54-8D2A7B1E4F60}_is1'
          $exe = Join-Path (Get-ItemProperty $key).InstallLocation 'MELETRA.exe'
          New-NetFirewallRule -DisplayName "block-meletra" -Direction Outbound -Action Block -Program $exe | Out-Null
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"                       # no tools of the build machine on the path
          $st = Start-Process $exe -ArgumentList '--selftest', "$PWD\selftest.json" -Wait -PassThru        # a windowed program: only Start-Process waits for it
          "self-test exit code $($st.ExitCode)"
          $r = Get-Content selftest.json -Raw | ConvertFrom-Json
          $r.checks | ForEach-Object { "{0,-18} {1} {2}" -f $_.name, $(if ($_.ok) {'ok'} else {'FAIL'}), $_.detail.Substring(0, [Math]::Min(90, $_.detail.Length)) }
          if (-not $r.ok) { throw "self-test failed" }
          $model = ($r.checks | Where-Object name -eq 'Model discovery').detail
          if ($model -notmatch 'Whisper Large-v3: installed') { throw "model not found: $model" }
          Invoke-WebRequest $env:JFK_URL -OutFile jfk.flac
          $env:MLT_ALLOW_MULTIPLE = "1"
          $p = Start-Process $exe -ArgumentList '--autorun', "$PWD\jfk.flac", '--result', "$PWD\result.json", '--timeout', '1500', '--language', 'en' -Wait -PassThru
          $res = Get-Content result.json -Raw | ConvertFrom-Json
          $res | Select-Object state, device, compute_type, audio_seconds, output_dir | Format-List
          if ($res.state -ne 'completed') { throw "transcription did not complete: $($res.state)" }
          $text = (Get-Content (Join-Path $res.output_dir 'local_raw_transcript.txt') -Raw).ToLower()
          "transcript: $text"
          if ($text -notmatch 'ask not what your country can do for you') { throw "unexpected transcript" }
          foreach ($f in 'local_clean_transcript.txt','medical_corrected_transcript.txt','correction_report.json','medical_quality_report.json','source_transcript.json') { if (-not (Test-Path (Join-Path $res.output_dir $f))) { throw "missing $f" } }
          # 4.1.1: the optional offline translation pack is installed and used - the saved transcript is translated again WITHOUT the recording, the speech model or a job (network still blocked)
          $pack = ($r.checks | Where-Object name -eq 'Translation pack')
          if ($pack.skipped -or $pack.detail -notmatch 'translated a sentence') { throw "translation pack self-test: $($pack.detail)" }
          $lang = ($r.checks | Where-Object name -eq 'Languages')
          if (-not $lang.ok -or $lang.skipped) { throw "languages self-test: $($lang.detail)" }
          foreach ($target in 'tr', 'de') {
            $out = "$PWD\translate_$target.json"
            $t = Start-Process $exe -ArgumentList '--translate-lecture', ('"' + $res.output_dir + '"'), '--to', $target, '--result', $out -Wait -PassThru
            $tj = Get-Content $out -Raw | ConvertFrom-Json
            "translation to ${target}: ok=$($tj.ok) status=$($tj.status) seconds=$($tj.seconds) cache=$($tj.from_cache) speech model loaded=$($tj.speech_recogniser_loaded)"
            if ($t.ExitCode -ne 0 -or -not $tj.ok -or $tj.speech_recogniser_loaded -ne $false -or $tj.from_cache) { throw "translation to $target from the saved transcript failed" }
            if (-not (Test-Path (Join-Path $res.output_dir "translations\$target.json"))) { throw "translations\$target.json was not saved" }
          }
          $again = Start-Process $exe -ArgumentList '--translate-lecture', ('"' + $res.output_dir + '"'), '--to', 'tr', '--result', "$PWD\translate_tr_again.json" -Wait -PassThru
          $aj = Get-Content "$PWD\translate_tr_again.json" -Raw | ConvertFrom-Json
          if (-not $aj.from_cache) { throw "asking for Turkish again did not use the saved translation" }
          Remove-NetFirewallRule -DisplayName "block-meletra"

  windows-verify-upgrade:
    needs: [windows-build, windows-stage]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the PUBLIC WhisperMedical 4.0.0 (the program an existing user has) and give it some user data
        shell: pwsh
        run: |
          Remove-Item Env:GH_TOKEN, Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $old = "https://github.com/twonezerotwo-hue/whispermedical-downloads/releases/download/windows-v4.0.0/WhisperMedical-Setup-Windows-x64.exe"
          curl.exe -fL --retry 8 --retry-all-errors -o old-setup.exe $old
          $h = (Get-FileHash old-setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne '2c8f8613c94367b496a507d6da9cd46e8b4d4bdd85b8533c5e3858998e4e9c2b') { throw "unexpected 4.0.0 setup ($h)" }
          $p = Start-Process .\old-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the 4.0.0 setup ended with $($p.ExitCode)" }
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{6F0B7C52-3A1E-4E7D-9C54-8D2A7B1E4F60}_is1'
          $item = Get-ItemProperty $key
          "before: $($item.DisplayName) $($item.DisplayVersion) in $($item.InstallLocation)"
          if (-not (Test-Path (Join-Path $item.InstallLocation 'MedicalLectureTranscriber.exe'))) { throw "the old program is not there" }
          $data = "$env:LOCALAPPDATA\MedicalLectureTranscriber"
          New-Item -ItemType Directory -Force "$data\Transcripts\My lecture", "$data\models\keep-me" | Out-Null
          Set-Content "$data\Transcripts\My lecture\local_clean_transcript.txt" "the student's transcript"
          Set-Content "$data\settings.json" '{"language": "tr", "theme": "light"}'
          Set-Content "$data\models\keep-me\model.bin" "a model"
      - name: Install the PUBLIC MELETRA setup of this staged release over it, silently, exactly as the installer program does
        shell: pwsh
        run: |
          Remove-Item Env:GH_TOKEN, Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $pins = Get-Content pins/windows.json -Raw | ConvertFrom-Json
          $base = "https://github.com/twonezerotwo-hue/whispermedical-downloads/releases/download/windows-v$($pins.version)"
          curl.exe -fL --retry 8 --retry-all-errors -o new-setup.exe "$base/$($pins.setup.name)"
          $h = (Get-FileHash new-setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $pins.setup.sha256) { throw "the public setup differs from the pinned SHA-256" }
          $p = Start-Process .\new-setup.exe -ArgumentList '/SILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the MELETRA setup ended with $($p.ExitCode)" }
      - name: One program is left - MELETRA - and the user's data is untouched
        shell: pwsh
        run: |
          $uninstall = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | Get-ItemProperty |
              Where-Object { $_.DisplayName -match 'MELETRA|WhisperMedical|Medical Lecture Transcriber' }
          $uninstall | Select-Object DisplayName, DisplayVersion, InstallLocation | Format-Table
          if (@($uninstall).Count -ne 1 -or $uninstall.DisplayName -notlike 'MELETRA*') { throw "Apps & Features must list exactly one program, MELETRA" }
          $dir = $uninstall.InstallLocation
          if (-not (Test-Path (Join-Path $dir 'MELETRA.exe'))) { throw "MELETRA.exe is missing in $dir" }
          if (Test-Path (Join-Path $dir 'MedicalLectureTranscriber.exe')) { throw "the old program file is still there" }
          $menu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs"
          if (-not (Test-Path "$menu\MELETRA")) { throw "no MELETRA entry in the Start menu" }
          foreach ($old in 'WhisperMedical', 'Medical Lecture Transcriber') { if (Test-Path "$menu\$old") { throw "the old Start menu folder '$old' is still there" } }
          $data = "$env:LOCALAPPDATA\MedicalLectureTranscriber"
          foreach ($f in 'Transcripts\My lecture\local_clean_transcript.txt', 'settings.json', 'models\keep-me\model.bin') { if (-not (Test-Path "$data\$f")) { throw "user data was lost: $f" } }
          if ((Get-Content "$data\settings.json" -Raw) -notmatch '"tr"') { throw "settings.json was changed" }
          "upgrade ok: one program (MELETRA), the data of the 4.0.0 user is untouched"

  # The upgrade a user of the LAST release makes: the public MELETRA 4.1.0 is installed with lectures and settings, then the setup of this staged release goes over it.
  windows-verify-upgrade-410:
    needs: [windows-build, windows-stage]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the PUBLIC MELETRA 4.1.0 and give it lectures and settings (a lecture made by 4.1.0 has no source_transcript.json)
        shell: pwsh
        run: |
          Remove-Item Env:GH_TOKEN, Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $old = "https://github.com/twonezerotwo-hue/whispermedical-downloads/releases/download/windows-v4.1.0/MELETRA-Setup-Windows-x64.exe"
          curl.exe -fL --retry 8 --retry-all-errors -o old-setup.exe $old
          $h = (Get-FileHash old-setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne '8be82bbc89549aa85093dec244608bf29a630ce41057eaaafdb7f649727527f3') { throw "unexpected 4.1.0 setup ($h)" }
          $p = Start-Process .\old-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the 4.1.0 setup ended with $($p.ExitCode)" }
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{6F0B7C52-3A1E-4E7D-9C54-8D2A7B1E4F60}_is1'
          $item = Get-ItemProperty $key
          "before: $($item.DisplayName) $($item.DisplayVersion) in $($item.InstallLocation)"
          if ($item.DisplayVersion -ne '4.1.0') { throw "expected MELETRA 4.1.0, found $($item.DisplayVersion)" }
          $data = "$env:LOCALAPPDATA\MedicalLectureTranscriber"
          New-Item -ItemType Directory -Force "$data\Transcripts\My lecture", "$data\models\keep-me" | Out-Null
          Set-Content "$data\Transcripts\My lecture\local_clean_transcript.txt" "the student's transcript"
          Set-Content "$data\Transcripts\My lecture\local_transcript.json" '{"segments": [{"start": 0, "end": 2, "text": "The patient has a headache.", "language": "en"}]}'
          Set-Content "$data\settings.json" '{"language": "tr", "theme": "dark"}'
          Set-Content "$data\models\keep-me\model.bin" "a model"
      - name: Install the setup of this staged release over it, silently, exactly as the installer program does
        shell: pwsh
        run: |
          Remove-Item Env:GH_TOKEN, Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $pins = Get-Content pins/windows.json -Raw | ConvertFrom-Json
          $base = "https://github.com/twonezerotwo-hue/whispermedical-downloads/releases/download/windows-v$($pins.version)"
          curl.exe -fL --retry 8 --retry-all-errors -o new-setup.exe "$base/$($pins.setup.name)"
          $h = (Get-FileHash new-setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $pins.setup.sha256) { throw "the public setup differs from the pinned SHA-256" }
          $p = Start-Process .\new-setup.exe -ArgumentList '/SILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the new setup ended with $($p.ExitCode)" }
      - name: One program is left - the new MELETRA - and the user's data is untouched
        shell: pwsh
        run: |
          $pins = Get-Content pins/windows.json -Raw | ConvertFrom-Json
          $uninstall = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | Get-ItemProperty |
              Where-Object { $_.DisplayName -match 'MELETRA|WhisperMedical|Medical Lecture Transcriber' }
          $uninstall | Select-Object DisplayName, DisplayVersion, InstallLocation | Format-Table
          if (@($uninstall).Count -ne 1 -or $uninstall.DisplayName -notlike 'MELETRA*') { throw "Apps & Features must list exactly one program, MELETRA" }
          if ($uninstall.DisplayVersion -ne $pins.version) { throw "Apps & Features shows $($uninstall.DisplayVersion), expected $($pins.version)" }
          $exe = Join-Path $uninstall.InstallLocation 'MELETRA.exe'
          if (-not (Test-Path $exe)) { throw "MELETRA.exe is missing" }
          if ((Get-Item $exe).VersionInfo.ProductName -ne 'MELETRA') { throw "the exe is not MELETRA" }
          $data = "$env:LOCALAPPDATA\MedicalLectureTranscriber"
          foreach ($f in 'Transcripts\My lecture\local_clean_transcript.txt', 'Transcripts\My lecture\local_transcript.json', 'settings.json', 'models\keep-me\model.bin') { if (-not (Test-Path "$data\$f")) { throw "user data was lost: $f" } }
          if ((Get-Content "$data\settings.json" -Raw) -notmatch '"dark"') { throw "settings.json was changed" }
          if ((Get-Content "$data\Transcripts\My lecture\local_clean_transcript.txt" -Raw).Trim() -ne "the student's transcript") { throw "a transcript was changed" }
          "upgrade ok: MELETRA $($pins.version) over 4.1.0, the lectures and settings of the 4.1.0 user are untouched"

  windows-promote:
    needs: [windows-build, windows-verify-clean, windows-verify-upgrade, windows-verify-upgrade-410]
    runs-on: ubuntu-latest
    outputs:
      before: ${{ steps.promote.outputs.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Put this release into the public manifest (the last step; one commit)
        id: promote
        run: |
          VER=$(python3 -c "import json;print(json.load(open('dist/pins.json'))['version'])")
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 scripts/sitetool.py set-platform windows dist/entry.json
          python3 scripts/sitetool.py set-product "$VER" --name MELETRA
          python3 scripts/sitetool.py validate
          git config user.name "MELETRA"; git config user.email "twonezerotwo-hue@users.noreply.github.com"
          git add release-manifest.json latest
          git commit -m "Manifest: MELETRA $VER for Windows (staging verification passed; the shipped installer program is verified next)" || true
          git pull --rebase origin main && git push origin HEAD:main

  windows-verify:
    needs: [windows-build, windows-promote]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      EXPECT_SHA: ${{ needs.windows-build.outputs.sha }}
    steps:
      - uses: actions/checkout@v4                                  # scripts/translation_pack.json: the pinned files of the optional translation pack
      - name: Wait until the public manifest shows THIS build's entry (GitHub Pages)
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 80; $i++) {
            try { $m = Invoke-RestMethod "$env:PAGE/release-manifest.json?x=$(Get-Random)"; if ($m.windows.bootstrapper.sha256 -eq $env:EXPECT_SHA) { break } } catch {}
            Start-Sleep 15
          }
          if ($m.windows.bootstrapper.sha256 -ne $env:EXPECT_SHA) { throw "the manifest never showed the entry of this build" }
          $m.windows | ConvertTo-Json -Depth 4 | Out-File manifest-windows.json
          "BOOT_URL=$($m.windows.bootstrapper.url)" | Out-File -Append $env:GITHUB_ENV
          "BOOT_SHA=$($m.windows.bootstrapper.sha256)" | Out-File -Append $env:GITHUB_ENV
      - name: Download the installer program like a visitor (no token) and check it
        shell: pwsh
        run: |
          Remove-Item Env:GH_TOKEN, Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          Invoke-WebRequest $env:BOOT_URL -OutFile boot.exe
          $h = (Get-FileHash boot.exe -Algorithm SHA256).Hash.ToLower()
          "downloaded boot.exe $((Get-Item boot.exe).Length) bytes sha256 $h"
          if ($h -ne $env:BOOT_SHA) { throw "the installer program differs from the manifest" }
      - name: Run the shipped installer program for real (downloads, verifies, installs)
        shell: pwsh
        run: |
          $p = Start-Process .\boot.exe -ArgumentList '--console','--unattended','--no-launch' -Wait -PassThru -RedirectStandardOutput boot.out.txt -RedirectStandardError boot.err.txt
          Get-Content boot.out.txt | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { Get-Content boot.err.txt; throw "installer exit code $($p.ExitCode)" }
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{6F0B7C52-3A1E-4E7D-9C54-8D2A7B1E4F60}_is1'
          $dir = (Get-ItemProperty $key).InstallLocation
          $exe = Join-Path $dir 'MELETRA.exe'
          if (-not (Test-Path $exe)) { throw "the program was not installed (looked in $dir)" }
          "installed in $dir"
          $model = "$env:LOCALAPPDATA\MedicalLectureTranscriber\models\whisper-large-v3"
          Get-ChildItem $model | Select-Object Name, Length | Format-Table
          if (-not (Test-Path "$model\model.bin")) { throw "the speech model was not placed" }
          if (Test-Path "$env:LOCALAPPDATA\MELETRAInstaller\cache") { throw "temporary installer files were left behind" }
          $pack = "$env:LOCALAPPDATA\MedicalLectureTranscriber\models\translation-m2m100"
          $tp = Get-Content scripts/translation_pack.json -Raw | ConvertFrom-Json
          foreach ($f in $tp.output.PSObject.Properties) {
            $p = Join-Path $pack $f.Name
            if (-not (Test-Path $p)) { throw "translation pack file missing: $($f.Name)" }
            $h = (Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
            if ((Get-Item $p).Length -ne [int64]$f.Value.size -or $h -ne $f.Value.sha256) { throw "translation pack file differs from its pin: $($f.Name)" }
          }
          "translation pack: every pinned file is in place"
      - name: The installed program works with the network blocked
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{6F0B7C52-3A1E-4E7D-9C54-8D2A7B1E4F60}_is1'
          $exe = Join-Path (Get-ItemProperty $key).InstallLocation 'MELETRA.exe'
          New-NetFirewallRule -DisplayName "block-meletra" -Direction Outbound -Action Block -Program $exe | Out-Null
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"                       # no tools of the build machine on the path
          $st = Start-Process $exe -ArgumentList '--selftest', "$PWD\selftest.json" -Wait -PassThru        # a windowed program: only Start-Process waits for it
          "self-test exit code $($st.ExitCode)"
          $r = Get-Content selftest.json -Raw | ConvertFrom-Json
          $r.checks | ForEach-Object { "{0,-18} {1} {2}" -f $_.name, $(if ($_.ok) {'ok'} else {'FAIL'}), $_.detail.Substring(0, [Math]::Min(90, $_.detail.Length)) }
          if (-not $r.ok) { throw "self-test failed" }
          $model = ($r.checks | Where-Object name -eq 'Model discovery').detail
          if ($model -notmatch 'Whisper Large-v3: installed') { throw "model not found: $model" }
          Invoke-WebRequest $env:JFK_URL -OutFile jfk.flac
          $env:MLT_ALLOW_MULTIPLE = "1"
          $p = Start-Process $exe -ArgumentList '--autorun', "$PWD\jfk.flac", '--result', "$PWD\result.json", '--timeout', '1500', '--language', 'en' -Wait -PassThru
          $res = Get-Content result.json -Raw | ConvertFrom-Json
          $res | Select-Object state, device, compute_type, audio_seconds, output_dir | Format-List
          if ($res.state -ne 'completed') { throw "transcription did not complete: $($res.state)" }
          $text = (Get-Content (Join-Path $res.output_dir 'local_raw_transcript.txt') -Raw).ToLower()
          "transcript: $text"
          if ($text -notmatch 'ask not what your country can do for you') { throw "unexpected transcript" }
          foreach ($f in 'local_clean_transcript.txt','medical_corrected_transcript.txt','correction_report.json','medical_quality_report.json','source_transcript.json') { if (-not (Test-Path (Join-Path $res.output_dir $f))) { throw "missing $f" } }
          # 4.1.1: the optional offline translation pack is installed and used - the saved transcript is translated again WITHOUT the recording, the speech model or a job (network still blocked)
          $pack = ($r.checks | Where-Object name -eq 'Translation pack')
          if ($pack.skipped -or $pack.detail -notmatch 'translated a sentence') { throw "translation pack self-test: $($pack.detail)" }
          $lang = ($r.checks | Where-Object name -eq 'Languages')
          if (-not $lang.ok -or $lang.skipped) { throw "languages self-test: $($lang.detail)" }
          foreach ($target in 'tr', 'de') {
            $out = "$PWD\translate_$target.json"
            $t = Start-Process $exe -ArgumentList '--translate-lecture', ('"' + $res.output_dir + '"'), '--to', $target, '--result', $out -Wait -PassThru
            $tj = Get-Content $out -Raw | ConvertFrom-Json
            "translation to ${target}: ok=$($tj.ok) status=$($tj.status) seconds=$($tj.seconds) cache=$($tj.from_cache) speech model loaded=$($tj.speech_recogniser_loaded)"
            if ($t.ExitCode -ne 0 -or -not $tj.ok -or $tj.speech_recogniser_loaded -ne $false -or $tj.from_cache) { throw "translation to $target from the saved transcript failed" }
            if (-not (Test-Path (Join-Path $res.output_dir "translations\$target.json"))) { throw "translations\$target.json was not saved" }
          }
          $again = Start-Process $exe -ArgumentList '--translate-lecture', ('"' + $res.output_dir + '"'), '--to', 'tr', '--result', "$PWD\translate_tr_again.json" -Wait -PassThru
          $aj = Get-Content "$PWD\translate_tr_again.json" -Raw | ConvertFrom-Json
          if (-not $aj.from_cache) { throw "asking for Turkish again did not use the saved translation" }
          Remove-NetFirewallRule -DisplayName "block-meletra"

  # If the shipped installer program fails its real test, the manifest goes back to what it was before windows-promote: the previous release stays what the public sees.
  windows-rollback:
    needs: [windows-promote, windows-verify]
    if: ${{ always() && needs.windows-promote.result == 'success' && needs.windows-verify.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore the previous manifest and take the staged release off the public list
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ needs.windows-promote.outputs.before }}
        run: |
          git checkout "$BEFORE" -- release-manifest.json latest
          git config user.name "MELETRA"; git config user.email "twonezerotwo-hue@users.noreply.github.com"
          git add release-manifest.json latest
          git commit -m "Manifest: rolled back - the shipped installer program of the new release failed its end-to-end test" || true
          git pull --rebase origin main && git push origin HEAD:main
          VER=$(python3 -c "import json;print(json.load(open('pins/windows.json'))['version'])")
          gh release edit "windows-v$VER" --draft=true || true
          echo "::error::The new release failed its end-to-end test; the previous manifest was restored."

  windows-ready:
    needs: [windows-verify, windows-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record the verification, then announce on the download page if the owner has confirmed the notices
        env:
          LEGAL: ${{ vars.LEGAL_ACKNOWLEDGED }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import json;print(json.load(open('pins/windows.json'))['version'])")
          python3 scripts/sitetool.py set-verified windows "$RUN_URL"
          if [ "$LEGAL" = "yes" ]; then
            python3 scripts/sitetool.py set-status windows ready
            MSG="MELETRA $VER for Windows verified end to end: download button enabled"
          else
            echo "::warning::Verified, but NOT announced: the owner has not confirmed the open-source notices (set the repository variable LEGAL_ACKNOWLEDGED=yes, then run the announce workflow)."
            MSG="MELETRA $VER for Windows verified end to end (button stays disabled until the owner confirms the notices)"
          fi
          git config user.name "MELETRA"; git config user.email "twonezerotwo-hue@users.noreply.github.com"
          git add release-manifest.json latest
          git commit -m "$MSG" || true
          git pull --rebase origin main && git push origin HEAD:main
          # the staged pre-release becomes the normal, latest release (the files are the ones that were just verified)
          gh release edit "windows-v$VER" --prerelease=false --latest

  # ================================================================================================================== Intel Mac
  mac-build:
    if: ${{ inputs.platform == 'mac-intel' }}
    runs-on: macos-15-intel
    outputs:
      sha: ${{ steps.entry.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the installer app with the pinned checksums, test its script, make the entry
        id: entry
        run: |
          test "$(uname -m)" = "x86_64"
          bash bootstrap/mac-intel/build.sh pins/mac-intel.json out
          python -m pip install --quiet pytest
          python -m pytest tests/test_mac_installer.py tests/test_site_tools.py -q
          python scripts/build_entries.py mac-intel out/MELETRA-Installer-IntelMac.zip > out/entry.json
          head -20 out/entry.json
          echo "sha=$(python -c "import json;print(json.load(open('out/entry.json'))['bootstrapper']['sha256'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            out/MELETRA-Installer-IntelMac.zip
            out/entry.json

  mac-publish:
    needs: mac-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: out
      - name: Complete the release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import json;print(json.load(open('pins/mac-intel.json'))['version'])")
          TAG="mac-intel-v$VER"
          python3 - <<'EOF'
          import json, subprocess, sys
          pins = json.load(open("pins/mac-intel.json"))
          out = subprocess.run(["gh", "release", "view", "mac-intel-v" + pins["version"], "--json", "assets", "--jq", ".assets | map({(.name): .size}) | add"], capture_output=True, text=True)
          have = json.loads(out.stdout or "{}")
          missing = [p["name"] for p in pins["dmg"]["parts"] if have.get(p["name"]) != p["size"]]
          if missing:
              sys.exit("the release is missing or has wrong-sized pieces: " + ", ".join(missing))
          EOF
          gh release upload "$TAG" out/MELETRA-Installer-IntelMac.zip licenses/THIRD_PARTY_LICENSES.txt licenses/MODEL_LICENSES.txt --clobber
          gh release edit "$TAG" --draft=false --latest=false --title "MELETRA $VER - Intel Mac" \
            --notes "Download page: https://twonezerotwo-hue.github.io/whispermedical-downloads/ . Open MELETRA-Installer-IntelMac.zip, then the installer app inside; it fetches and checks everything else. Intel Macs only."
      - name: Write the manifest entry (uploaded, not yet announced)
        run: |
          python3 -c "import json;print(json.dumps(json.load(open('out/entry.json'))))" > /tmp/e.json
          VER=$(python3 -c "import json;print(json.load(open('pins/mac-intel.json'))['version'])")
          python3 scripts/sitetool.py set-platform mac-intel /tmp/e.json
          git config user.name "MELETRA"; git config user.email "twonezerotwo-hue@users.noreply.github.com"
          git add release-manifest.json latest
          git commit -m "Manifest: Intel Mac $VER uploaded (verification running)" || true
          git pull --rebase origin main && git push origin HEAD:main

  mac-verify:
    needs: [mac-build, mac-publish]
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      EXPECT_SHA: ${{ needs.mac-build.outputs.sha }}
    steps:
      - name: Wait until the public manifest shows THIS build's entry (GitHub Pages)
        run: |
          for i in $(seq 1 80); do
            curl -fsS "$PAGE/release-manifest.json?x=$RANDOM" -o m.json && python3 -c "import json,sys,os;sys.exit(0 if json.load(open('m.json')).get('mac_intel',{}).get('bootstrapper',{}).get('sha256')==os.environ['EXPECT_SHA'] else 1)" && break
            sleep 15
          done
          python3 -c "import json,sys,os;sys.exit(0 if json.load(open('m.json'))['mac_intel']['bootstrapper']['sha256']==os.environ['EXPECT_SHA'] else 1)" || { echo "the manifest never showed the entry of this build"; exit 1; }
          python3 -c "import json;m=json.load(open('m.json'))['mac_intel'];print(m['bootstrapper']['url']);open('boot_url','w').write(m['bootstrapper']['url']);open('boot_sha','w').write(m['bootstrapper']['sha256'])"
      - name: Download the installer like a visitor (no token, no login) and check it
        run: |
          unset GH_TOKEN GITHUB_TOKEN
          curl -fL --proto '=https' -o MELETRA-Installer-IntelMac.zip "$(cat boot_url)"
          test "$(shasum -a 256 MELETRA-Installer-IntelMac.zip | cut -d' ' -f1)" = "$(cat boot_sha)"
          unzip -q MELETRA-Installer-IntelMac.zip
          ls -la "MELETRA Installer.app/Contents/Resources"
          cat "MELETRA Installer.app/Contents/Resources/pins.env"
      - name: Run the real installer script (downloads about 3 GB, verifies, mounts, copies)
        run: |
          unset GH_TOKEN GITHUB_TOKEN
          df -h /System/Volumes/Data | tail -1
          bash "MELETRA Installer.app/Contents/Resources/install.sh" --dest "$RUNNER_TEMP/Applications" --no-open --progress-file "$RUNNER_TEMP/progress.txt"
          tail -3 "$RUNNER_TEMP/progress.txt"
          APP="$RUNNER_TEMP/Applications/MELETRA.app"; [ -d "$APP" ] || APP="$RUNNER_TEMP/Applications/WhisperMedical.app"; [ -d "$APP" ] || APP="$RUNNER_TEMP/Applications/Medical Lecture Transcriber.app"
          test -d "$APP"
          test ! -d "$HOME/Library/Caches/MELETRAInstaller" || { echo "temporary files left behind"; exit 1; }
          mount | grep -q "MELETRA" && { echo "image still mounted"; exit 1; } || true
          echo "quarantine attribute: $(xattr -p com.apple.quarantine "$APP" 2>&1 | head -1)"
          spctl --assess --type execute -vv "$APP" 2>&1 | head -2 || true
      - name: The installer APP itself (window code, progress file, install into a folder) - same download again
        continue-on-error: true
        timeout-minutes: 40
        run: |
          unset GH_TOKEN GITHUB_TOKEN
          rm -rf "$RUNNER_TEMP/Applications2"; mkdir -p "$RUNNER_TEMP/Applications2"
          WM_AUTOMATED=1 WM_DEST="$RUNNER_TEMP/Applications2" WM_ERROR_FILE="$RUNNER_TEMP/applet_error.txt" "MELETRA Installer.app/Contents/MacOS/applet" || true
          if [ -f "$RUNNER_TEMP/applet_error.txt" ]; then echo "installer app reported: $(cat "$RUNNER_TEMP/applet_error.txt")"; exit 1; fi
          test -d "$RUNNER_TEMP/Applications2/MELETRA.app" || test -d "$RUNNER_TEMP/Applications2/WhisperMedical.app" || test -d "$RUNNER_TEMP/Applications2/Medical Lecture Transcriber.app"
          echo "installer app: ok"
      - name: The installed app works with the network blocked
        run: |
          APP="$RUNNER_TEMP/Applications/MELETRA.app"; [ -d "$APP" ] || APP="$RUNNER_TEMP/Applications/WhisperMedical.app"; [ -d "$APP" ] || APP="$RUNNER_TEMP/Applications/Medical Lecture Transcriber.app"
          EXE="$APP/Contents/MacOS/MELETRA"; [ -x "$EXE" ] || EXE="$APP/Contents/MacOS/MedicalLectureTranscriber"
          export HOME_TEST="$RUNNER_TEMP/home"; mkdir -p "$HOME_TEST"
          BLOCK='(version 1)(allow default)(deny network*)(allow network* (remote unix-socket))(allow network* (remote ip "localhost:*"))'
          ! sandbox-exec -p "$BLOCK" python3 -c "import socket; socket.create_connection(('1.1.1.1',443),5)" 2>/dev/null || { echo "network block did not work"; exit 1; }
          env -i HOME="$HOME_TEST" PATH=/usr/bin:/bin:/usr/sbin:/sbin LANG=en_US.UTF-8 TMPDIR="$RUNNER_TEMP" QT_QPA_PLATFORM=offscreen MLT_SELFTEST_DEEP=1 sandbox-exec -p "$BLOCK" "$EXE" --selftest "$RUNNER_TEMP/selftest.json" || true
          python3 - <<'EOF'
          import json, os
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/selftest.json"))
          for c in r["checks"]:
              print(("ok  " if c["ok"] else "FAIL"), c["name"], c["detail"][:100])
          assert r["ok"], "self-test failed"
          model = next(c for c in r["checks"] if c["name"] == "Model discovery")["detail"]
          assert "Whisper Large-v3: installed" in model, model
          EOF
          curl -fsSL "$JFK_URL" -o "$RUNNER_TEMP/jfk.flac"
          env -i HOME="$HOME_TEST" PATH=/usr/bin:/bin:/usr/sbin:/sbin LANG=en_US.UTF-8 TMPDIR="$RUNNER_TEMP" QT_QPA_PLATFORM=offscreen MLT_ALLOW_MULTIPLE=1 sandbox-exec -p "$BLOCK" "$EXE" --autorun "$RUNNER_TEMP/jfk.flac" --result "$RUNNER_TEMP/result.json" --timeout 1500 --language en || true
          python3 - <<'EOF'
          import json, os, pathlib
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/result.json"))
          print({k: r.get(k) for k in ("state", "device", "compute_type", "audio_seconds")})
          assert r["state"] == "completed", r
          out = pathlib.Path(r["output_dir"])
          text = (out / "local_raw_transcript.txt").read_text().lower()
          print("transcript:", text)
          assert "ask not what your country can do for you" in text
          for f in ("local_clean_transcript.txt", "medical_corrected_transcript.txt", "correction_report.json", "medical_quality_report.json"):
              assert (out / f).is_file(), f
          models = pathlib.Path(os.environ["HOME_TEST"]) / "Library" / "Application Support" / "MedicalLectureTranscriber" / "models"
          assert not models.exists() or not any(models.iterdir()), "a model was copied or downloaded into the user folder"
          EOF

  mac-ready:
    needs: mac-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record the verification, then announce on the download page if the owner has confirmed the notices
        env:
          LEGAL: ${{ vars.LEGAL_ACKNOWLEDGED }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          VER=$(python3 -c "import json;print(json.load(open('pins/mac-intel.json'))['version'])")
          python3 scripts/sitetool.py set-verified mac-intel "$RUN_URL"
          if [ "$LEGAL" = "yes" ]; then
            python3 scripts/sitetool.py set-status mac-intel ready
            MSG="Intel Mac $VER verified end to end: download button enabled"
          else
            echo "::warning::Verified, but NOT announced: the owner has not confirmed the open-source notices (set the repository variable LEGAL_ACKNOWLEDGED=yes, then run the announce workflow)."
            MSG="Intel Mac $VER verified end to end (button stays disabled until the owner confirms the notices)"
          fi
          git config user.name "MELETRA"; git config user.email "twonezerotwo-hue@users.noreply.github.com"
          git add release-manifest.json latest
          git commit -m "$MSG" || true
          git pull --rebase origin main && git push origin HEAD:main
