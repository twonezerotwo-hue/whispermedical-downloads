name: rehearse-model

# Rehearsal on a clean Windows machine: the installer program fetches the REAL speech model from the public release (redirects, resume, 3 GB, SHA-256, joining
# model.bin from its two pieces) with a harmless stand-in for the Setup program. Proves the model path before the real Setup is published.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch the real model through the test build of the installer program
        shell: bash
        run: |
          python scripts/rehearse_model.py
